Fedora42-gcc-imake-gen-64bit-xrootd:
  tags:
    - k8s-default
  stage: build
  image: gitlab-registry.cern.ch/delphi/docker/builder-fed42:latest
  before_script:
    - dnf -y install lapack-devel blas-devel imake  libX11 libX11-devel libXaw-devel libXau-devel xbae xbae-devel tcsh
    - dnf -y  install libnsl  libnsl2-devel || true
    - dnf -y  install xrootd-client-libs xrootd-client-devel
  script:
    - CI/build.sh imake tarball GNU14 nodebug ON
  artifacts:
    paths:
      - cern

Fedora42-gcc-imake-gen-64bit-xrootd-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/delphi/docker/builder-fed42:latest
  stage: tar
  dependencies:
    - Fedora42-gcc-imake-gen-64bit-xrootd
  script:
    kind=imake comp=gcc xrd=1 CI/tar.sh
  artifacts:
    paths:
      - cern
