# Note: xbae is gone from Alma10/Rhel10
Alma10-gcc-cmake-gen-64bit:
  tags:
    - k8s-default
  stage: build
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/builder-al10
  before_script:
    - dnf config-manager --set-enabled crb
    - dnf -y  install  libnsl  libnsl2-devel bc || true
    - dnf -y install  epel-release cmake cmake3 python3 openssl-libs openssl-devel chrpath || true 
  script:
    - CI/build.sh cmake tarball GNU nodebug OFF
  allow_failure:  false
  artifacts:
    paths:
      - cern

Alma10-gcc-cmake-gen-64bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/builder-al10
  stage: tar
  when: manual
  dependencies:
    - Alma10-gcc-cmake-gen-64bit
  script:
    kind=cmake comp=gcc CI/tar.sh
  artifacts:
    paths:
      - cern
