Fedora44-gcc-cmake-gen-64bit-xrootd:
  tags:
    - k8s-default
  stage: build
  image: gitlab-registry.cern.ch/delphi/docker/builder-fedora44:latest
  before_script:
    - dnf -y install cmake cmake3 python3 openssl-libs openssl-devel chrpath || true 
    - dnf -y install lapack-devel blas-devel imake  libX11 libX11-devel libXaw-devel libXau-devel xbae xbae-devel tcsh
    - dnf -y install libnsl  libnsl2-devel || true
    - dnf -y install xrootd-client-libs xrootd-client-devel
  script:
    - CI/build.sh cmake tarball GNU nodebug ON
  artifacts:
    paths:
      - cern

Fedora44-gcc-cmake-gen-64bit-xrootd-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/delphi/docker/builder-fedora44:latest
  stage: tar
  dependencies:
    - Fedora44-gcc-cmake-gen-64bit-xrootd
  needs:
    - Fedora44-gcc-cmake-gen-64bit-xrootd
  script:
    kind=cmake comp=gcc xrd=1 CI/tar.sh
  artifacts:
    paths:
      - cern
