Ubuntu20-gcc-imake-gen-64bit:
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/delphi/docker/builder-ubuntu20:latest
  stage: build
  before_script:
    - export DEBIAN_FRONTEND=noninteractive
    - export TZ=Etc/UTC
    - apt-get update  > /dev/null
    - apt-get install -y -qq cmake g++ apt-utils bc > /dev/null
    - apt-get install -y -qq gfortran  doxygen wget graphviz libz-dev >/dev/null
    - apt-get install -y -qq devscripts build-essential > /dev/null
    - apt-get install -y -qq libxbae-dev liblapack-dev
    - apt-get install -y -qq xutils-dev x11-common xorg-dev libmotif-dev
    - ls
  script:
    - CI/build.sh imake tarball GNU nodebug OFF
  artifacts:
    paths:
      - cern/

Ubuntu20-gcc-imake-gen-64bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/delphi/docker/builder-ubuntu20:latest
  stage: tar
  needs:
    - Ubuntu20-gcc-imake-gen-64bit
  dependencies:
    - Ubuntu20-gcc-imake-gen-64bit
  script:
    kind=imake comp=gcc CI/tar.sh
  artifacts:
    paths:
      - cern
