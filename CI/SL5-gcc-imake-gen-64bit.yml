SL5-gcc-imake-gen-64bit:
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl5_64:ext
  stage: build
  script:
    - CI/build.sh imake tarball GNU nodebug OFF
  allow_failure: false
  artifacts:
    paths:
      - cern

SL5-gcc-imake-gen-64bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl5_64:ext
  stage: tar
  needs:
    - SL5-gcc-imake-gen-64bit
  dependencies:
    - SL5-gcc-imake-gen-64bit
  script:
    kind=imake comp=gcc CI/tar.sh
  artifacts:
    paths:
      - cern
