Centos8-nvc-cmake-gen-64bit:
  tags:
    - k8s-default
  stage: build
  image: gitlab-registry.cern.ch/linuxsupport/rpmci/builder-cs8
  only:
    variables:
     - $CI_COMMIT_MESSAGE =~ /NVIDIA/
  before_script:
    - yum -y  install  libnsl  libnsl2-devel || true
    - yum-config-manager -y --add-repo https://developer.download.nvidia.com/hpc-sdk/rhel/nvhpc.repo
    - yum install -y nvhpc-22.5
  script:
    - CI/build.sh cmake tarball NVIDIA nodebug OFF

Centos8-nvc-cmake-gen-64bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/builder-cs8
  stage: tar
  when: manual
  dependencies:
    - Centos8-nvc-cmake-gen-64bit
  script:
     kind=cmake comp=NVIDIA xrd=0 CI/tar.sh
  artifacts:
    paths:
      - cern
