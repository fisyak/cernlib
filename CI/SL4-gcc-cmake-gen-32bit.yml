SL4-gcc-cmake-gen-32bit:
  tags:
    - k8s-default
  stage: build
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl4_32:ext
  script:
    - CI/build.sh cmake tarball GNU4 nodebug OFF
  allow_failure: false
  artifacts:
    paths:
      - cern

SL4-gcc-cmake-gen-32bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl4_32:ext
  stage: tar
  needs:
    - SL4-gcc-cmake-gen-32bit
  dependencies:
    - SL4-gcc-cmake-gen-32bit
  script:
    kind=cmake comp=gcc LEGACY=-m32 CI/tar.sh
  artifacts:
    paths:
      - cern
