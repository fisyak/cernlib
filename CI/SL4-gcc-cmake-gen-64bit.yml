SL4-gcc-cmake-gen-64bit:
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl4_64:ext
  stage: build
  script:
    - CI/build.sh cmake tarball GNU4 nodebug OFF
  allow_failure: false
  artifacts:
    paths:
      - cern

SL4-gcc-cmake-gen-64bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl4_64:ext
  stage: tar
  needs:
    - SL4-gcc-cmake-gen-64bit
  dependencies:
    - SL4-gcc-cmake-gen-64bit
  script:
    kind=cmake comp=gcc CI/tar.sh
  artifacts:
    paths:
      - cern
