Fedora42-gcc-cmake-gen-64bit:
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/delphi/docker/builder-fed42:latest
  stage: build
  before_script:
    - dnf -y install cmake cmake3 python3 openssl-libs openssl-devel chrpath || true 
    - dnf -y install lapack-devel blas-devel imake  libX11 libX11-devel libXaw-devel libXau-devel xbae xbae-devel tcsh
    - dnf -y install libnsl  libnsl2-devel || true
    - dnf -y install xrootd-client-libs xrootd-client-devel
  script:
    - CI/build.sh cmake tarball GNU nodebug OFF
  artifacts:
    paths:
      - cern

Fedora42-gcc-cmake-gen-64bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/delphi/docker/builder-fed42:latest
  stage: tar
  dependencies:
    - Fedora42-gcc-cmake-gen-64bit
  script:
    kind=cmake comp=gcc xrd=0 CI/tar.sh
  artifacts:
    paths:
      - cern
