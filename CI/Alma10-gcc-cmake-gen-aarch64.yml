Alma10-gcc-cmake-gen-aarch64:
  tags:
    - k8s-arm
  stage: build
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/builder-al10-aarch64
  before_script:
    - dnf config-manager --set-enabled crb
    - yum -y  install  libnsl  libnsl2-devel bc || true
    - yum -y install  epel-release cmake cmake3 python3 openssl-libs openssl-devel chrpath || true 
  script:
    - CI/build.sh cmake tarball GNU nodebug OFF
  allow_failure:  false
  artifacts:
    paths:
      - cern

Alma10-gcc-cmake-gen-aarch64-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-arm
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/builder-al10-aarch64
  stage: tar
  when: manual
  dependencies:
    - Alma10-gcc-cmake-gen-aarch64
  script:
    kind=cmake comp=gcc CI/tar.sh
  artifacts:
    paths:
      - cern
