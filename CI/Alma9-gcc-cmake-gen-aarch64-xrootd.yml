Alma9-gcc-cmake-gen-aarch64-xrootd:
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/builder-al9-aarch64
  tags:
    - k8s-arm
  stage: build
  before_script:
    - dnf config-manager --set-enabled crb
    - dnf -y install gcc gcc-c++ gcc-gfortran bc > rpm.log || (cat rpm.log && exit 1)
    - dnf -y install libnsl libnsl2-devel || true
    - dnf -y install epel-release cmake cmake3 python3 openssl-libs openssl-devel chrpath || true 
    - dnf -y install xrootd-client-libs xrootd-client-devel
  script:
    - CI/build.sh cmake tarball GNU nodebug ON
  allow_failure:  false
  artifacts:
    paths:
      - cern


Alma9-gcc-cmake-gen-aarch64-xrootd-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-arm
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/builder-al9-aarch64
  stage: tar
  needs:
    - Alma9-gcc-cmake-gen-aarch64-xrootd
  dependencies:
    - Alma9-gcc-cmake-gen-aarch64-xrootd
  script:
    kind=cmake comp=gcc xrd=1 CI/tar.sh
  artifacts:
    paths:
      - cern
