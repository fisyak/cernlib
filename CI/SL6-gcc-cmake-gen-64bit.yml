SL6-gcc-cmake-gen-64bit:
  tags:
    - k8s-default
  stage: build
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl6_64:ext
  script:
    - CI/build.sh cmake tarball GNU nodebug OFF
  allow_failure: false
  artifacts:
    paths:
      - cern

SL6-gcc-cmake-gen-64bit-pub:
  only:
    refs:
      - tags
  tags:
    - k8s-default
  image: gitlab-registry.cern.ch/dphep/cernlib/docker/sl6_64:ext
  stage: tar
  needs:
    - SL6-gcc-cmake-gen-64bit
  dependencies:
    - SL6-gcc-cmake-gen-64bit
  script:
    kind=cmake comp=gcc CI/tar.sh
  artifacts:
    paths:
      - cern
